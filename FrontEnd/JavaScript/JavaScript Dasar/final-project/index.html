<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>final-project</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="text-center mb-5 fw-bold text-primary">Kasir Warkop</h1>

        <div id="mainPage">
            <div class="row">
                <div class="col-md-6">
                    <div class="card shadow-sm mb-4">
                        <div class="card-header bg-primary text-white">
                            <h4>Daftar Menu</h4>
                        </div>
                        <div class="card-body">
                            <div id="areaMenu"></div>
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="card shadow-sm mb-4">
                        <div class="card-header bg-success text-white">
                            <h4>Daftar Belanja</h4>
                        </div>
                        <div class="card-body">
                            <div id="areaBelanja"></div>
                        </div>
                        <div class="card-footer">
                            <div class="d-flex justify-content-between align-items-center">
                                <h5 class="mb-0">Total :</h5>
                                <h4 class="mb-0 text-success fw-bold" id="total">Rp. 0</h4>
                            </div>
                            <div>
                                <button onclick="bayar()" class="btn btn-success btn-lg w-100 my-2">Bayar</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>            
        </div>

        <div id="notaPage" class="d-none">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card shadow">
                        <div class="card-body text-center p-5">
                            <h2 class="text-success fw-bold mb-4">Pembayaran Berhasil</h2>
                            <h5>Nota Belanja Anda</h5>

                            <hr>

                            <div id="detail" class="text-start mb-4"></div>
                            
                            <hr>

                            <button onclick="selesai()" class="btn btn-primary w-100">Kembali</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
</html>
