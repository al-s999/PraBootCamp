<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan 2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="row text-center p-4">
        <h1>Latihan #2 Tipe Data</h1>
    </div>

    <div class="container">
        <div class="row justify-content-center mt-3">
            <div class="col-3">
                <div class="input-group">
                    <input type="text" class="form-control" id="angka_1" placeholder="Angka Pertama" aria-placeholder="Angka Pertama">
                </div>
            </div>
            <div class="col-3">
                <div class="input-group">
                    <input type="number" class="form-control" id="angka_2" placeholder="Angka Kedua" aria-placeholder="Angka Kedua">
                </div>
            </div>
        </div>

        <div class="row justify-content-center mt-4">
            <button class="btn btn-primary col-2" id="jumlah">Jumlah</button>
        </div>

        <div class="row text-center mt-4"><span id="hasil">Hasil</span></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
</html>
