<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan 3 - kalkulator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container py-5">
        <div class="h1 mb-4">Latihan Kalkulator</div>

        <div class="mb-3">
            <label for="number1" class="form-label">Angka Pertama</label>
            <input type="number" class="form-control" id="number1">
        </div>

        <div class="mb-3">
            <label for="operator" class="form-label">Operator :</label>
            <input class="form-control" id="operator" placeholder=" + , - , * , / " maxlength="1">
        </div>

        <div class="mb-3">
            <label for="number2" class="form-label">Angka Kedua</label>
            <input type="number" class="form-control" id="number2">
        </div>

        <button onclick="calculate()" class="btn btn-primary">Hitung</button>

        <div class="card mt-3">
            <div class="card-body">
                <h5 class="card-title">hasil</h5>
                <p class="mt-3" id="hasil"></p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
</html>
